<!doctype html>

<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DayDream X</title>
		<script>
			self.__ddxBase = (function () {
        var p = location.pathname;
        // Normalize: extensionless URLs without trailing slash are directories.
        var last = p.split('/').pop() || '';
        if (!p.endsWith('/') && last && !/\.[a-z0-9]+$/i.test(last)) {
          p = p + '/';
        }
        var i = p.indexOf('/internal/');
        var appBase = i !== -1
          ? p.substring(0, i + 1)
          : p.substring(0, p.lastIndexOf('/') + 1);
        // <base> anchors every relative ref (script/link/modulepreload/img) to
        // the page's real directory, so /app vs /app/ vs /app/x.html (and
        // /app/internal/foo vs /app/internal/foo/) all resolve the same on ANY
        // static host — no server-side redirect required.
        var dirBase = p.substring(0, p.lastIndexOf('/') + 1);
        document.write('<base href="' + dirBase + '">');
        return appBase;
      })();
		</script>
		<script src="./assets/config.js" defer></script>
		<script src="./assets/obscura.iife.js" defer></script>
		<script src="./assets/s.js" defer></script>
    <script src="./assets/api.js" defer></script>
		<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
		<link rel="preconnect" href="https://www.google-analytics.com" crossorigin />
		<link rel="preload" as="image" href="./res/logo.png" fetchpriority="high" />
		<link rel="icon" type="image/x-icon" href="./res/logo.png" />

		<meta name="description" content="Your favorite Browser in a browser" />
		<meta
			name="keywords"
			content="Daydream, Daydream Browser, Daydream Browser, Daydream Browser, Daydream Security Browser"
		/>
		<meta property="og:image" content="./res/logo.png" />

		<script>
			window.dataLayer = window.dataLayer || [];
			window.gtag = function () { window.dataLayer.push(arguments); };
			gtag('js', new Date());
			gtag('config', 'G-BMERY7ZH6Z');
			(function () {
				var tag = document.createElement('script');
				tag.async = true;
				// Package-relative so static subpath mounts stay in-package.
				tag.src = new URL('api/tag.js', document.baseURI || location.href).toString();
				function executeInlineFallback() {
					try {
						var baked = document.getElementById('ddx-gtag-inline');
						if (!baked || !baked.textContent) return;
						var raw = baked.textContent.replace(/\s+/g, '');
						var bin = atob(raw);
						var bytes = new Uint8Array(bin.length);
						for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
						var inline = document.createElement('script');
						inline.textContent = new TextDecoder().decode(bytes);
						document.head.appendChild(inline);
					} catch (e) {}
					var el = document.getElementById('ddx-gtag-inline');
					if (el) el.remove();
				}
				// Static hosts have no API server. Only the script falls back;
				// collection always uses Google's normal browser endpoints.
				tag.onerror = function () {
					tag.onerror = null;
					var direct = document.createElement('script');
					direct.async = true;
					direct.src = 'https://www.googletagmanager.com/gtag/js?id=G-BMERY7ZH6Z';
					direct.onerror = function () {
						fetch(new URL('tag-fallback.js', location.href).toString())
							.then(function (response) {
								if (!response.ok) throw new Error('fallback unavailable');
								return response.text();
							})
							.then(function (code) {
								var inline = document.createElement('script');
								inline.textContent = code;
								document.head.appendChild(inline);
							})
							.catch(function () { executeInlineFallback(); });
					};
					document.head.appendChild(direct);
				};
				document.head.appendChild(tag);
			})();
		</script>
	</head>

	<body class="bg-[var(--background-color)] text-[var(--text-color)]">
		<div id="app-host"></div>
		<script type="module" src="/src/index.ts" defer></script>
	</body>
</html>
